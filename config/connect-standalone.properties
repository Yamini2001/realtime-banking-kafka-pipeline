# Bootstrap Kafka cluster brokers
bootstrap.servers=localhost:9092

# Local storage configuration converters for structural offsets
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter

# Internal offset storage configurations for tracking standalone jobs
offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=10000

# VERY IMPORTANT: Point this path to your exact Kafka installation libs directory
plugin.path=/home/yamini/kafka_2.13-3.7.0/libs/connect-file-3.7.0.jar
